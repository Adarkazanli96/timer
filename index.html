<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Prep & Count Up Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 3rem 4rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 480px;
    }

    .phase-badge {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    .phase-idle {
      background: #334155;
      color: #94a3b8;
    }

    .phase-prep {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .phase-running {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .display {
      font-size: 5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2.5rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
    }

    .display.prep {
      font-size: 7.5rem;
      color: #f59e0b;
    }

    .display.running {
      color: #38bdf8;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.8rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #2563eb;
    }

    button.secondary {
      background: #334155;
      color: #cbd5e1;
    }

    button.secondary:hover {
      background: #475569;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <div id="badge" class="phase-badge phase-idle">Ready</div>
    <div id="display" class="display">00:00.0</div>
    <div class="controls">
      <button id="startBtn" onclick="toggleTimer()">Start</button>
      <button id="resetBtn" class="secondary" onclick="resetTimer()">Reset</button>
    </div>
    <p class="hint">Press <strong>Spacebar</strong> to Start / Stop</p>
  </div>
  <script>
    let state = "idle", prepRemaining = 5, prepInterval = null, countUpInterval = null, startTime = null, audioCtx = null;
    function playBeep(freq = 600, duration = 0.12, type = "sine") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }

        // Resume context if suspended by iOS policy
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // Linear ramp works more reliably than exponential on iOS WebKit
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }
    function formatTime(ms) {
      const tot = Math.floor(ms / 1000);
      const m = String(Math.floor(tot / 60)).padStart(2, "0");
      const s = String(tot % 60).padStart(2, "0");
      const tenths = Math.floor((ms % 1000) / 100);
      return `${m}:${s}.${tenths}`;
    }
    function toggleTimer() {state === "idle" ? startPrep() : stopTimer();}
    function startPrep() {
      state = "prep"; prepRemaining = 5;
      document.getElementById("startBtn").textContent = "Cancel";
      document.getElementById("badge").textContent = "Get Ready";
      document.getElementById("badge").className = "phase-badge phase-prep";
      const display = document.getElementById("display");
      display.className = "display prep"; display.textContent = prepRemaining;
      playBeep(440, 0.1);
      prepInterval = setInterval(() => {
        prepRemaining--;
        if (prepRemaining > 0) {display.textContent = prepRemaining; playBeep(440, 0.1);}
        else {clearInterval(prepInterval); startCountUp();}
      }, 1000);
    }
    function startCountUp() {
      state = "running"; playBeep(880, 0.35);
      document.getElementById("startBtn").textContent = "Stop";
      document.getElementById("badge").textContent = "Timer Running";
      document.getElementById("badge").className = "phase-badge phase-running";
      const display = document.getElementById("display");
      display.className = "display running";
      startTime = performance.now();
      display.textContent = "00:00.0";
      countUpInterval = setInterval(() => {
        display.textContent = formatTime(performance.now() - startTime);
      }, 50);
    }
    function stopTimer() {
      clearInterval(prepInterval); clearInterval(countUpInterval); state = "idle";
      document.getElementById("startBtn").textContent = "Start";
      document.getElementById("badge").textContent = "Stopped";
      document.getElementById("badge").className = "phase-badge phase-idle";
      document.getElementById("display").classList.remove("prep");
    }
    function resetTimer() {
      stopTimer();
      document.getElementById("badge").textContent = "Ready";
      document.getElementById("display").className = "display";
      document.getElementById("display").textContent = "00:00.0";
    }
    window.addEventListener("keydown", (e) => {if (e.code === "Space") {e.preventDefault(); toggleTimer();} });
  </script>
</body>

</html>
